<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시급 2배 챌린지 꿀팁</title>

    <!-- 프리텐다드 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        :root {
            --primary: #FCD20B;
            --primary-light: #FFF4CC;
            --primary-dark: #E5BC00;
            --brown: #452614;
            --brown-light: #5C3A1E;
            --orange: #FF8C00;
            --bg-cream: #FFFEF9;
            --bg-card: #FFFFFF;
            --text-dark: #452614;
            --text-medium: #5C3A1E;
            --text-light: #8A7355;
            --border: #F0E8D8;
            --shadow: rgba(69, 38, 20, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 메인 홈 ===== */
        .home-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 20px 40px;
            min-height: 100vh;
        }

        .home-header {
            padding: 32px 0 24px;
            text-align: center;
        }

        .home-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .home-logo-icon {
            display: none;
        }

        .home-logo-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--brown);
            letter-spacing: -0.3px;
        }

        .home-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .home-title span {
            color: var(--brown);
            background: linear-gradient(transparent 60%, var(--primary) 40%);
        }

        .home-subtitle {
            font-size: 15px;
            color: var(--text-medium);
            line-height: 1.5;
        }

        /* 공지사항 박스 */
        .notice-box {
            background: #FFF0F0;
            border: 2px solid #FFCDD2;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notice-highlight {
            background: linear-gradient(transparent 50%, #FFF59D 50%);
            padding: 0 2px;
        }

        .notice-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .notice-text {
            font-size: 13px;
            font-weight: 600;
            color: #C62828;
            line-height: 1.4;
        }

        /* 카드 그리드 */
        .tips-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 8px;
        }

        .tip-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            position: relative;
        }

        .tip-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .tip-card:active {
            transform: scale(0.98);
        }

        .tip-card-thumb {
            width: 100%;
            aspect-ratio: 858/1189;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .tip-card-placeholder {
            font-size: 48px;
            opacity: 0.9;
        }

        .tip-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tip-card-content {
            padding: 14px 12px 16px;
        }

        .tip-card-episode {
            font-size: 11px;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .tip-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.4;
            letter-spacing: -0.3px;
        }

        /* ===== 컷툰 뷰어 ===== */
        .viewer-container {
            display: none;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-cream);
            position: relative;
        }

        .viewer-header {
            position: sticky;
            top: 0;
            background: rgba(255,251,235,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .viewer-back {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-dark);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .viewer-back:hover {
            background: var(--brown);
            color: var(--primary);
        }

        .viewer-title-area {
            flex: 1;
        }

        .viewer-episode {
            font-size: 11px;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 0.5px;
        }

        .viewer-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-top: 2px;
            letter-spacing: -0.3px;
        }

        /* 슬라이더 영역 */
        .viewer-slider {
            padding: 12px;
            position: relative;
        }

        .slide-container {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        .slides-wrapper {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            min-width: 100%;
            position: relative;
            aspect-ratio: 858/1189;
            overflow: hidden;
        }

        /* 일반 슬라이드 - 이미지만 꽉 차게 */
        .slide-image-only {
            width: 100%;
            height: 100%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .slide-placeholder {
            font-size: 80px;
            position: relative;
            z-index: 1;
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .slide-tip-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 12px;
        }

        .slide-cut-number {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            z-index: 2;
        }

        /* 팁 슬라이드 - 텍스트 + 이미지 */
        .slide-tip {
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .slide-tip-header {
            background: var(--brown);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slide-tip-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .slide-tip-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .slide-tip-title {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            margin-top: 2px;
            line-height: 1.3;
        }

        .slide-tip-body {
            background: var(--primary-light);
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
        }

        .slide-tip-box {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 2px solid var(--primary);
        }

        .slide-tip-box-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--brown);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slide-tip-list {
            list-style: none;
        }

        .slide-tip-list li {
            font-size: 13px;
            line-height: 1.6;
            padding: 6px 0;
            padding-left: 24px;
            position: relative;
            color: var(--text-dark);
        }

        .slide-tip-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            font-weight: 700;
            font-size: 14px;
            color: var(--brown);
        }

        /* 팁 슬라이드 내 이미지 영역 (858x572 비율) */
        .slide-tip-image {
            width: 100%;
            aspect-ratio: 858/572;
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--primary);
        }

        .slide-tip-image .slide-placeholder {
            font-size: 48px;
        }

        .slide-tip-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
        }

        /* 잠금 상태 카드 */
        .tip-card.locked {
            pointer-events: none;
            position: relative;
        }

        .tip-card.locked .tip-card-thumb {
            background: #E8E8E8;
        }

        .tip-card.locked .tip-card-content {
            opacity: 0.5;
        }

        .tip-card-lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 5;
        }

        .tip-card-lock-icon {
            font-size: 32px;
            opacity: 0.4;
        }

        .tip-card-lock-text {
            font-size: 11px;
            font-weight: 700;
            color: #FF6B35;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* 다른 편 보기 잠금 */
        .other-tip-item.locked {
            pointer-events: none;
        }

        .other-tip-item.locked .other-tip-thumb {
            background: #E8E8E8;
            position: relative;
        }

        .other-tip-item.locked .other-tip-label,
        .other-tip-item.locked .other-tip-name {
            opacity: 0.5;
        }

        .other-tip-lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .other-tip-lock-icon {
            font-size: 18px;
            opacity: 0.4;
        }

        .other-tip-lock-text {
            font-size: 8px;
            font-weight: 700;
            color: #FF6B35;
            letter-spacing: 0.3px;
            text-align: center;
        }

        .other-tip-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        /* 오버레이 네비게이션 버튼 */
        .slide-nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            padding: 0 8px;
        }

        .slide-nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            transition: all 0.2s;
            pointer-events: auto;
        }

        .slide-nav-btn:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.3);
        }

        .slide-nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .slide-nav-btn:disabled {
            opacity: 0;
            pointer-events: none;
        }

        /* 하단 인디케이터 */
        .slide-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            gap: 6px;
        }

        .slide-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s;
        }

        .slide-dot.active {
            width: 20px;
            border-radius: 3px;
            background: var(--brown);
        }

        /* 다른 편 보기 */
        .other-tips {
            padding: 20px 16px 40px;
            border-top: 1px solid var(--border);
        }

        .other-tips-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .other-tips-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .other-tips-list::-webkit-scrollbar {
            display: none;
        }

        .other-tip-item {
            flex-shrink: 0;
            width: 80px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .other-tip-item:hover {
            transform: translateY(-2px);
        }

        .other-tip-item.current {
            pointer-events: none;
        }

        .other-tip-thumb {
            width: 80px;
            height: 110px;
            background: var(--primary-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 6px;
            border: 2px solid transparent;
            transition: all 0.2s;
            overflow: hidden;
        }

        .other-tip-item:hover:not(.current) .other-tip-thumb {
            border-color: var(--primary);
        }

        .other-tip-item.current .other-tip-thumb {
            border-color: var(--primary);
        }

        /* 현재 안 보고 있는 편 - 투명도 적용 */
        .other-tip-item:not(.current):not(.locked) .other-tip-thumb {
            opacity: 0.8;
        }

        .other-tip-item:not(.current):not(.locked):hover .other-tip-thumb {
            opacity: 1;
        }

        .other-tip-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--orange);
        }

        .other-tip-name {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.3;
            margin-top: 2px;
        }

        /* 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tip-card {
            animation: fadeInUp 0.5s ease backwards;
        }

        .tip-card:nth-child(1) { animation-delay: 0.1s; }
        .tip-card:nth-child(2) { animation-delay: 0.2s; }
        .tip-card:nth-child(3) { animation-delay: 0.3s; }
        .tip-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>

    <!-- 메인 홈 -->
    <div class="home-container" id="home">
        <header class="home-header">
            <div class="home-logo">
                <div class="home-logo-icon">☕</div>
                <span class="home-logo-text">패스오더</span>
            </div>
            <h1 class="home-title">
                <span>시급 2배</span> 챌린지<br>
                꿀팁 모음
            </h1>
            <p class="home-subtitle">
                정민 매니저가 알려드리는<br>
                쿠폰 전달 노하우 4편 💡
            </p>
            <div class="notice-box">
                <span class="notice-icon">📢</span>
                <span class="notice-text">1월 챌린지 기간 연장! <span class="notice-highlight">2/12(목)</span>까지 활동 가능</span>
            </div>
        </header>

        <div class="tips-grid">
            <!-- JavaScript로 동적 렌더링 -->
        </div>
    </div>

    <!-- 컷툰 뷰어 -->
    <div class="viewer-container" id="viewer">
        <header class="viewer-header">
            <button class="viewer-back" onclick="closeViewer()">←</button>
            <div class="viewer-title-area">
                <div class="viewer-episode" id="viewerEpisode">1편</div>
                <div class="viewer-title" id="viewerTitle">처음 손님에게 쿠폰 전달하는 법</div>
            </div>
        </header>

        <div class="viewer-slider">
            <div class="slide-container">
                <div class="slides-wrapper" id="slidesWrapper">
                    <!-- 슬라이드가 JavaScript로 동적 생성됨 -->
                </div>
                
                <!-- 오버레이 네비게이션 -->
                <div class="slide-nav-overlay">
                    <button class="slide-nav-btn" id="prevBtn" onclick="prevSlide()">←</button>
                    <button class="slide-nav-btn" id="nextBtn" onclick="nextSlide()">→</button>
                </div>
            </div>

            <div class="slide-indicator" id="slideIndicator">
                <!-- 도트가 JavaScript로 동적 생성됨 -->
            </div>
        </div>

        <div class="notice-box" style="margin: 0 16px 16px;">
            <span class="notice-icon">📢</span>
            <span class="notice-text">1월 챌린지 기간 연장! <span class="notice-highlight">2/12(목)</span>까지 활동 가능</span>
        </div>

        <div class="other-tips">
            <div class="other-tips-title">📚 다른 꿀팁 보기</div>
            <div class="other-tips-list" id="otherTipsList">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

                slides: [

                    { type: 'image', image: 'images/2-1컷.png', cutNumber: 1 },
                    {

                        tipType: 'message',
                        title: '시급 2배 챌린지 참여하면 모두가 좋아요!',
                        subMessage: '사장님 눈치볼 필요 없어요!',
                        tips: [
                            '👤 사장님: 매장 홍보 + 단골 고객 확보',
                            '👤 알바: 같은 시간 일하고 추가 수익',
                            '👤 손님: 100원에 커피 마시기'
                        ],
                        tipImage: 'images/2-2컷_팁박스1.jpg'
                    },
                    { type: 'image', image: 'images/2-3컷.png', cutNumber: 3 },
                    { 
                        type: 'tip',
                        tipType: 'message',
                        title: '손님이 많아져도 걱정 NO!',
                        subMessage: '패스오더로 주문하면, 오히려 할 일이 줄어들어요!',
                        tips: [
                            '📱 손님: 앱에서 주문·결제·적립 → 줄 안 서고 바로 픽업',
                            '☕ 알바: 주문·결제·적립 안 하고 음료 제조에만 집중',
                            '✨ [시급 2배 챌린지] 활동 열심히 할수록 내 일까지 편리하게!'
                        ],
                        tipImage: 'images/2-4컷_팁박스2.jpg'
                    },
                    { type: 'image', image: 'images/2-5컷.png', cutNumber: 5 }
                ]
            },
            3: {
                episode: '3편',
                title: '다른 알바들은 어떻게 성과 내고 있을까?',
                icon: '💡',
                thumbnail: 'images/3-썸네일.png',
                slides: [
                    { type: 'thumbnail', image: 'images/3-썸네일.png' },
                    { type: 'image', image: 'images/3-1컷.png', cutNumber: 1 },
                    { type: 'image', image: 'images/3-2컷.png', cutNumber: 2 },
                    { type: 'image', image: 'images/3-3컷.png', cutNumber: 3 },
                    { type: 'image', image: 'images/3-4컷.png', cutNumber: 4 },
                    { 
                        type: 'tip',
                        tipType: 'message',
                        title: '성과 내고 있는 알바들의 꿀팁!',
                        subMessage: '손님 눈에 잘 띄는 곳에 두세요!',
                        tips: [
                            '📍 주문받는 POS 옆에',
                            '📍 주문받는 키오스크 옆에',
                            '📍 음료 받아가는 픽업대 옆에'
                        ],
                        tipImage: 'images/3-5컷_팁박스.jpg'
                    }
                ]
            },
            4: {
                episode: '4편',
                title: '같은 시간 일하고 월 60만원 추가로 버는 꿀팁',
                icon: '🏆',
                thumbnail: 'images/4-썸네일.png',
                slides: [
                    { type: 'thumbnail', image: 'images/4-썸네일.png' },
                    { type: 'image', image: 'images/4-1컷.png', cutNumber: 1 },
                    { type: 'image', image: 'images/4-2컷.png', cutNumber: 2 },
                    { 
                        type: 'tip',
                        tipType: 'message',
                        title: '손님에게 쿠폰을 통해 바로 첫 주문하도록<br>도와드리면, 확실하게 2,000원씩 추가 수익!',
                        subMessage: '',
                        tips: [
                            '☕ 매장에서 주문하는 손님에게 바로 쿠폰을 통해 첫 주문하도록 도와드려보세요!',
                            '💬 쿠폰 건네면서 "바로 사용해보실래요?" 한마디로 시작! 첫 주문까지 도와드리면 더 좋아요!',
                            '💰 <span class="notice-highlight">1분 안에, 확실하게 +2,000원을 벌 수 있어요</span>'
                        ],
                        tipImage: 'images/4-3컷_팁박스.jpg'
                    },
                    { type: 'image', image: 'images/4-4컷.png', cutNumber: 4 }
                ]
            }
        };

        const otherTipsInfo = [
            { ep: 1, icon: '🎯', title: '쿠폰 전달법' },
            { ep: 2, icon: '🤝', title: '눈치 NO' },
            { ep: 3, icon: '💡', title: '다른 알바들' },
            { ep: 4, icon: '🏆', title: '월 60만원 꿀팁' }
        ];

        let currentEpisode = 1;
        let currentSlide = 0;
        let touchStartX = 0;
        let touchEndX = 0;
        
        // 에피소드별 최대 도달 슬라이드 기록 (최초 도달 체크용)
        let maxReachedSlide = {}; 

        // ===== 이벤트 트래킹 =====
        function getClientTime() {
            return new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
        }

        function trackEvent(eventName, eventParams = {}) {
            const eventData = {
                server_time: new Date().toISOString(),
                client_time: getClientTime(),
                alba_id: albaId,
                event_name: eventName,
                event_params: JSON.stringify(eventParams),
                method: 'GET',
                page_url: window.location.href,
                referrer: document.referrer || 'direct',
                user_agent: navigator.userAgent
            };

            // GTM dataLayer push
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                'event': eventName,
                'alba_id': albaId,
                'entry_episode': entryEpisode,
                ...eventParams
            });

            // Google Sheets 로깅
            sendToSheet(eventData);

            // 콘솔 로그 (디버깅용)
            console.log('Event tracked:', eventName, eventParams);
        }

        function sendToSheet(data) {
            const params = new URLSearchParams(data).toString();
            fetch(SHEET_WEBHOOK_URL + '?' + params, { mode: 'no-cors' });
        }

        // ===== 페이지뷰 이벤트 =====
        function trackPageView() {
            trackEvent('page_view', {
                entry_episode: entryEpisode,
                max_accessible: maxAccessibleEpisode,
                view_type: 'home'
            });
        }

        // ===== 메인 함수들 =====
        function isEpisodeLocked(episode) {
            return episode > maxAccessibleEpisode;
        }

        function openViewer(episode, fromHome = false) {
            if (isEpisodeLocked(episode)) {
                return; // 잠긴 에피소드는 열지 않음
            }

            // 홈에서 클릭한 경우 home_tip_click 이벤트
            if (fromHome) {
                trackEvent('home_tip_click', {
                    clicked_episode: episode
                });
            }

            currentEpisode = episode;
            currentSlide = 0;
            
            // 최대 도달 슬라이드 초기화 (첫 슬라이드부터 시작)
            if (!maxReachedSlide[episode]) {
                maxReachedSlide[episode] = 0;
            }
            
            document.getElementById('home').style.display = 'none';
            document.getElementById('viewer').style.display = 'block';
            
            // 스크롤 맨 위로 이동
            window.scrollTo(0, 0);
            
            const data = tipsData[episode];
            document.getElementById('viewerEpisode').textContent = data.episode;
            document.getElementById('viewerTitle').textContent = data.title;
            
            renderSlides(data.slides);
            renderOtherTips();
            
            // 애니메이션 없이 즉시 첫 슬라이드로 이동
            const wrapper = document.getElementById('slidesWrapper');
            wrapper.style.transition = 'none';
            updateSlidePosition();
            
            // 다음 프레임에서 transition 복원
            requestAnimationFrame(() => {
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            });

            // 에피소드 열기 이벤트
            trackEvent('episode_open', {
                episode: episode,
                episode_title: data.title,
                total_slides: data.slides.length
            });

            // 첫 슬라이드 최초 도달 이벤트 (처음 여는 경우만)
            if (maxReachedSlide[episode] === 0) {
                trackEvent('slide_reach', {
                    episode: episode,
                    reached_slide: 1,
                    total_slides: data.slides.length,
                    method: 'open'
                });
                maxReachedSlide[episode] = 0; // 인덱스 기준
            }
        }

        function closeViewer() {
            // 뒤로가기 이벤트
            trackEvent('episode_back', {
                episode: currentEpisode,
                max_reached_slide: (maxReachedSlide[currentEpisode] || 0) + 1,
                total_slides: tipsData[currentEpisode].slides.length
            });

            document.getElementById('viewer').style.display = 'none';
            document.getElementById('home').style.display = 'block';
        }

        function renderHomeCards() {
            const grid = document.querySelector('.tips-grid');
            grid.innerHTML = '';

            const titles = {
                1: '처음 손님에게 쿠폰<br>전달하는 가장 쉬운 방법',
                2: '사장님 눈치 볼<br>필요 없는 이유',
                3: '다른 알바들은 어떻게<br>성과 내고 있을까?',
                4: '같은 시간 일하고 월<br>60만원 추가로 버는 꿀팁'
            };

            const icons = ['🎯', '🤝', '💡', '🏆'];

            for (let i = 1; i <= 4; i++) {
                const isLocked = isEpisodeLocked(i);
                const card = document.createElement('div');
                card.className = `tip-card ${isLocked ? 'locked' : ''}`;
                card.onclick = () => openViewer(i, true); // fromHome = true
                
                const data = tipsData[i];
                const hasThumbnail = data.thumbnail && !isLocked;
                
                card.innerHTML = `
                    <div class="tip-card-thumb">
                        ${hasThumbnail 
                            ? `<img src="${data.thumbnail}" alt="${i}편 썸네일" class="tip-card-img">` 
                            : (isLocked 
                                ? `<div class="tip-card-lock">
                                     <span class="tip-card-lock-icon">🔒</span>
                                     <span class="tip-card-lock-text">COMING SOON</span>
                                   </div>`
                                : `<span class="tip-card-placeholder">${icons[i-1]}</span>`)
                        }
                    </div>
                    <div class="tip-card-content">
                        <div class="tip-card-episode">${i}편</div>
                        <div class="tip-card-title">${titles[i]}</div>
                    </div>
                `;
                
                grid.appendChild(card);
            }
        }

        function renderSlides(slides) {
            const wrapper = document.getElementById('slidesWrapper');
            const totalSlides = slides.length;
            
            wrapper.innerHTML = slides.map((slide, index) => {
                if (slide.type === 'thumbnail') {
                    // 썸네일 슬라이드 (첫 화면)
                    return `
                        <div class="slide">
                            <div class="slide-image-only">
                                <img src="${slide.image}" alt="썸네일" class="slide-img">
                            </div>
                        </div>
                    `;
                } else if (slide.type === 'tip') {
                    // 팁 슬라이드 - 텍스트 + 이미지
                    const hasImage = slide.tipImage;
                    const isMessageType = slide.tipType === 'message';
                    
                    if (isMessageType) {
                        // 메시지 타입 (2편 등)
                        return `
                            <div class="slide">
                                <div class="slide-tip">
                                    <div class="slide-tip-header">
                                        <div class="slide-tip-icon">💡</div>
                                        <div>
                                            <div class="slide-tip-label">정민 매니저 팁</div>
                                            <div class="slide-tip-title">${slide.title}</div>
                                        </div>
                                    </div>
                                    <div class="slide-tip-body">
                                        <div class="slide-tip-box">
                                            ${slide.subMessage ? `<div class="slide-tip-box-title">${slide.subMessage}</div>` : ''}
                                            <ul class="slide-tip-list">
                                                ${slide.tips.map(tip => `<li>${tip}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div class="slide-tip-image">
                                            ${hasImage 
                                                ? `<img src="${slide.tipImage}" alt="팁 이미지" class="slide-tip-img">`
                                                : `<span class="slide-placeholder">${slide.tipIcon || '💡'}</span>`
                                            }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // 기본 타입 (1편 등)
                        return `
                            <div class="slide">
                                <div class="slide-tip">
                                    <div class="slide-tip-header">
                                        <div class="slide-tip-icon">💡</div>
                                        <div>
                                            <div class="slide-tip-label">정민 매니저 팁</div>
                                            <div class="slide-tip-title">${slide.title}</div>
                                        </div>
                                    </div>
                                    <div class="slide-tip-body">
                                        <div class="slide-tip-box">
                                            <div class="slide-tip-box-title">✅ 이렇게 해보세요!</div>
                                            <ul class="slide-tip-list">
                                                ${slide.tips.map(tip => `<li>${tip}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div class="slide-tip-image">
                                            ${hasImage 
                                                ? `<img src="${slide.tipImage}" alt="팁 이미지" class="slide-tip-img">`
                                                : `<span class="slide-placeholder">${slide.tipIcon || '💡'}</span>`
                                            }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    // 일반 슬라이드 - 이미지
                    const hasImage = slide.image;
                    return `
                        <div class="slide">
                            <div class="slide-image-only">
                                ${hasImage 
                                    ? `<img src="${slide.image}" alt="${slide.cutNumber}컷" class="slide-img">`
                                    : `<span class="slide-placeholder">${slide.icon}</span>`
                                }
                            </div>
                        </div>
                    `;
                }
            }).join('');

            // 도트 렌더링
            const indicatorContainer = document.getElementById('slideIndicator');
            indicatorContainer.innerHTML = slides.map((_, i) => 
                `<div class="slide-dot ${i === 0 ? 'active' : ''}"></div>`
            ).join('');

            // 터치 이벤트를 slide-container에 추가 (팁 슬라이드에서도 동작하도록)
            const slideContainer = wrapper.parentElement;
            slideContainer.removeEventListener('touchstart', handleTouchStart);
            slideContainer.removeEventListener('touchend', handleTouchEnd);
            slideContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
            slideContainer.addEventListener('touchend', handleTouchEnd, { passive: true });
        }

        function renderOtherTips() {
            const container = document.getElementById('otherTipsList');
            container.innerHTML = otherTipsInfo.map(tip => {
                const isLocked = isEpisodeLocked(tip.ep);
                const isCurrent = tip.ep === currentEpisode;
                const data = tipsData[tip.ep];
                const hasThumbnail = data.thumbnail && !isLocked;
                
                return `
                    <div class="other-tip-item ${isCurrent ? 'current' : ''} ${isLocked ? 'locked' : ''}" 
                         onclick="handleOtherTipClick(${tip.ep})">
                        <div class="other-tip-thumb" style="position: relative;">
                            ${hasThumbnail 
                                ? `<img src="${data.thumbnail}" alt="${tip.ep}편" class="other-tip-thumb-img">`
                                : (isLocked 
                                    ? `<div class="other-tip-lock">
                                         <span class="other-tip-lock-icon">🔒</span>
                                         <span class="other-tip-lock-text">COMING SOON</span>
                                       </div>`
                                    : tip.icon)
                            }
                        </div>
                        <div class="other-tip-label">${tip.ep}편</div>
                        <div class="other-tip-name">${tip.title}</div>
                    </div>
                `;
            }).join('');
        }

        function handleOtherTipClick(episode) {
            if (isEpisodeLocked(episode) || episode === currentEpisode) {
                return;
            }
            
            // 다른 꿀팁 클릭 이벤트 (뷰어 하단에서)
            trackEvent('other_tip_click', {
                from_episode: currentEpisode,
                to_episode: episode,
                from_slide: currentSlide + 1
            });

            openViewer(episode, false); // fromHome = false
        }

        function updateSlidePosition() {
            const wrapper = document.getElementById('slidesWrapper');
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

            // 도트 업데이트
            document.querySelectorAll('.slide-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });

            // 버튼 상태
            const slides = tipsData[currentEpisode].slides;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
        }

        function trackSlideReachIfNew(method) {
            const slides = tipsData[currentEpisode].slides;
            
            // 최초 도달인 경우만 이벤트 발생
            if (currentSlide > (maxReachedSlide[currentEpisode] || 0)) {
                maxReachedSlide[currentEpisode] = currentSlide;
                
                trackEvent('slide_reach', {
                    episode: currentEpisode,
                    reached_slide: currentSlide + 1,
                    total_slides: slides.length,
                    method: method
                });

                // 마지막 슬라이드 도달 시 episode_complete
                if (currentSlide === slides.length - 1) {
                    trackEvent('episode_complete', {
                        episode: currentEpisode,
                        episode_title: tipsData[currentEpisode].title
                    });
                }
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlidePosition();
                // 뒤로 가는 건 이벤트 기록 안 함
            }
        }

        function nextSlide() {
            const slides = tipsData[currentEpisode].slides;
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlidePosition();
                trackSlideReachIfNew('button');
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                const slides = tipsData[currentEpisode].slides;
                
                if (diff > 0 && currentSlide < slides.length - 1) {
                    // 앞으로 스와이프
                    currentSlide++;
                    updateSlidePosition();
                    trackSlideReachIfNew('swipe');
                } else if (diff < 0 && currentSlide > 0) {
                    // 뒤로 스와이프 (이벤트 기록 안 함)
                    currentSlide--;
                    updateSlidePosition();
                }
            }
        }

        // ===== 초기화 =====
        window.onload = function() {
            // 홈 카드 렌더링 (잠금 상태 반영)
            renderHomeCards();
            
            // 페이지뷰 이벤트
            trackPageView();

            // ep 파라미터가 있으면 해당 에피소드로 바로 이동
            const epParam = urlParams.get('ep');
            if (epParam && tipsData[epParam] && !isEpisodeLocked(parseInt(epParam))) {
                openViewer(parseInt(epParam), false); // URL 직접 진입은 home_tip_click 아님
            }
        };
    </script>
</body>
